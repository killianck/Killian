<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquettes 3D fenêtre bois</title>
<meta name="description" content="Maquettes 3D interactives d'une fenêtre bois haut de gamme : coupe de la traverse basse et battement à mouton et gueule de loup.">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Atelier de maquettes : scène 3D à gauche, fiche des pièces à droite ; empilé sur téléphone. Palette et polices du site. */
:root {
  --bg: #EDECE8;
  --surface: #FFFFFF;
  --stage: #E2E0DA;
  --ink: #111315;
  --muted: #4B5055;
  --line: rgba(17,19,21,.15);
  --accent: #111315;
  --accent-ink: #FFFFFF;
  --sable: #C9AE84;
  --chip: #F4F3F0;
  --font-display: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-data: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; }
.app {
  box-sizing: border-box; height: 100%;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) 368px; gap: 16px;
}
.viewport { position: relative; min-width: 0; min-height: 0; background: var(--stage); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.viewport canvas:active { cursor: grabbing; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.marker {
  position: absolute; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px;
  border-radius: 50%; border: 2px solid var(--surface); background: var(--accent); color: var(--accent-ink);
  font: 700 12px/1 var(--font-body); display: flex; align-items: center; justify-content: center;
  pointer-events: auto; cursor: pointer; padding: 0; box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
.marker[aria-pressed="true"] { outline: 3px solid var(--sable); outline-offset: 1px; }
.hint {
  position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  font: 500 12px/1.4 var(--font-data); color: var(--muted); pointer-events: none;
}
.hint b { color: var(--ink); font-weight: 600; }
.toolbar {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,.08);
}
.btn {
  font: 600 13px/1 var(--font-body); color: var(--ink); background: var(--chip);
  border: 1px solid var(--line); border-radius: 7px; padding: 0 12px; height: 36px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn:focus-visible, .marker:focus-visible, .part:focus-visible, .eye:focus-visible, input:focus-visible { outline: 3px solid var(--sable); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg .btn { border: 0; border-radius: 0; border-right: 1px solid var(--line); }
.seg .btn:last-child { border-right: 0; }
.slider { display: flex; align-items: center; gap: 8px; flex: 1 1 180px; min-width: 150px; }
.slider label { font: 600 12px/1 var(--font-data); color: var(--muted); white-space: nowrap; }
.slider input { flex: 1; min-width: 0; accent-color: var(--accent); }
.slider output { font: 600 12px/1 var(--font-data); width: 38px; text-align: right; font-variant-numeric: tabular-nums; }

.panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.models { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); flex-shrink: 0; }
.models button {
  font: 600 13px/1.2 var(--font-body); color: var(--muted); background: transparent; border: 0; padding: 10px 8px; cursor: pointer; text-align: center;
  border-right: 1px solid var(--line); min-height: 44px;
}
.models button:last-child { border-right: 0; }
.models button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.models button:focus-visible { outline: 3px solid var(--sable); outline-offset: -3px; }
.head { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font: 600 11px/1.3 var(--font-data); letter-spacing: .12em; color: var(--muted); }
.title { margin: 0; font: 600 24px/1.1 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); line-height: 1.5; font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card-top { display: flex; align-items: center; gap: 10px; }
.badges { display: flex; gap: 4px; }
.badge { min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: 700 12px/24px var(--font-body); text-align: center; }
.card h2 { margin: 0; font: 600 18px/1.2 var(--font-display); }
.card p { margin: 0; line-height: 1.55; font-size: 14px; }
.details { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.details li { display: flex; gap: 8px; line-height: 1.45; font-size: 13px; }
.details .badge { flex-shrink: 0; min-width: 22px; height: 22px; line-height: 22px; font-size: 11px; }
.list-title { display: flex; justify-content: space-between; align-items: baseline; }
.list-title h3 { margin: 0; font: 600 14px/1 var(--font-display); }
.list-title span { font: 500 12px/1 var(--font-data); color: var(--muted); }
.parts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.parts li { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.parts li:last-child { border-bottom: 0; }
.part {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: transparent; border: 0;
  color: var(--ink); text-align: left; font: 500 14px/1.25 var(--font-body); cursor: pointer;
}
.part:hover { background: var(--chip); }
.part[aria-pressed="true"] { background: var(--chip); box-shadow: inset 3px 0 0 var(--sable); font-weight: 700; }
.part .num { font: 600 12px/1 var(--font-data); color: #8C7350; min-width: 34px; }
.part.off { color: var(--muted); text-decoration: line-through; }
.eye { width: 44px; flex-shrink: 0; background: transparent; border: 0; border-left: 1px solid var(--line); color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.eye:hover { color: var(--ink); background: var(--chip); }
.eye svg { width: 18px; height: 18px; }
.foot { font-size: 12px; line-height: 1.5; color: var(--muted); margin: 0; }
.error { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--muted); line-height: 1.5; }

@media (max-width: 880px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); }
  .viewport { height: 480px; } /* hauteur fixe : dans un cadre, « vh » suivrait la hauteur du cadre lui-même */
  .panel { overflow: visible; }
}
@media (max-width: 520px) {
  .hint .controls-hint { display: none; }
  .seg .btn { padding: 0 9px; }
}
</style>
</head>
<body>

<div class="app">
  <section class="viewport" id="viewport" aria-label="Maquette 3D de fenêtre bois">
    <div class="labels" id="labels"></div>
    <div class="hint">
      <span id="hintModel"></span>
      <span class="controls-hint">Glisser : tourner · Molette ou pincer : zoomer · Clic droit : déplacer</span>
    </div>
    <div class="toolbar">
      <button class="btn primary" id="explodeBtn" type="button">Éclater</button>
      <div class="slider">
        <label for="explode">Vue éclatée</label>
        <input id="explode" type="range" min="0" max="100" value="0">
        <output id="explodeOut" for="explode">0 %</output>
      </div>
      <div class="seg" role="group" aria-label="Points de vue">
        <button class="btn" type="button" data-view="coupe">Coupe</button>
        <button class="btn" type="button" data-view="trois">3/4</button>
        <button class="btn" type="button" data-view="ext">Extérieur</button>
        <button class="btn" type="button" data-view="int">Intérieur</button>
      </div>
      <button class="btn" type="button" id="finishBtn" aria-pressed="false">Peint</button>
      <button class="btn" type="button" id="labelsBtn" aria-pressed="true">Repères</button>
      <button class="btn" type="button" id="spinBtn" aria-pressed="false">Rotation</button>
    </div>
  </section>

  <aside class="panel">
    <div class="models" role="group" aria-label="Choix de la maquette">
      <button type="button" data-model="coupe" aria-pressed="false">Coupe de fenêtre</button>
      <button type="button" data-model="battement" aria-pressed="false">Battement à mouton</button>
    </div>
    <div class="head">
      <div class="eyebrow" id="eyebrow"></div>
      <p class="title" id="title"></p>
      <p class="lede" id="lede"></p>
    </div>

    <div class="card" id="card" aria-live="polite">
      <div class="card-top"><div class="badges" id="cardBadges"></div><h2 id="cardTitle"></h2></div>
      <p id="cardText"></p>
      <ul class="details" id="cardDetails" hidden></ul>
    </div>

    <div class="list-title"><h3>Pièces</h3><span id="visibleCount"></span></div>
    <ul class="parts" id="parts"></ul>

    <p class="foot" id="foot"></p>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const viewportEl = document.getElementById('viewport');
  if (!window.THREE || !THREE.OrbitControls) {
    const d = document.createElement('div'); d.className = 'error';
    d.textContent = "La maquette 3D n'a pas pu se charger. Rechargez la page pour réessayer.";
    viewportEl.appendChild(d); return;
  }
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const $ = (id) => document.getElementById(id);

  /* ================= Rendu ================= */
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  viewportEl.insertBefore(renderer.domElement, viewportEl.firstChild);
  renderer.domElement.setAttribute('aria-label', 'Vue 3D interactive : glisser pour tourner, molette pour zoomer');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(css('--stage') || '#E2E0DA');
  const camera = new THREE.PerspectiveCamera(32, 1, 1, 6000);
  camera.position.set(300, 170, 380);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 80; controls.maxDistance = 1600;
  controls.autoRotateSpeed = 1.2;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 0.95);
  key.position.set(260, 460, 380); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -380, right: 380, top: 380, bottom: -380, near: 50, far: 1700 });
  key.shadow.bias = -0.0006;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xdfe9ff, 0.35); rim.position.set(-400, 120, -260); scene.add(rim);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), new THREE.ShadowMaterial({ opacity: 0.16 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  /* ================= Matières ================= */
  let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  // Bois de bout : cernes + lignes de colle du lamellé-collé 3 plis. Zone couverte : x0..x0+w, y0..y0+h (mm, coordonnées du profil)
  function capTexture({ x0, w, y0, h, plies, axis, tone }) {
    const W = 512, Hc = Math.max(128, Math.round(512 * h / w)), sx = W / w, sy = Hc / h;
    const c = document.createElement('canvas'); c.width = W; c.height = Hc;
    const g = c.getContext('2d');
    g.fillStyle = tone || '#D4A677'; g.fillRect(0, 0, W, Hc);
    const band = ([a, b]) => axis === 'x'
      ? [(a - x0) * sx, 0, (b - a) * sx, Hc]
      : [0, (y0 + h - b) * sy, W, (b - a) * sy];
    plies.forEach((p, i) => {
      const [bx, by, bw, bh] = band(p);
      g.save(); g.beginPath(); g.rect(bx, by, bw, bh); g.clip();
      const cx = axis === 'x' ? bx + bw / 2 + (i % 2 ? 46 : -46) : -260 - i * 90;
      const cy = axis === 'x' ? Hc + 220 + i * 60 : by + bh / 2 + (i % 2 ? 14 : -14);
      for (let r = 30; r < 1700; r += 6 + rnd() * 7) {
        g.strokeStyle = 'rgba(146,96,52,' + (0.16 + rnd() * 0.24).toFixed(2) + ')';
        g.lineWidth = 1 + rnd() * 1.8;
        g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
      }
      g.restore();
    });
    g.fillStyle = 'rgba(72,42,20,0.9)';
    plies.slice(1).forEach(([a]) => {
      if (axis === 'x') g.fillRect((a - x0) * sx - 1.6, 0, 3.2, Hc);
      else g.fillRect(0, (y0 + h - a) * sy - 1.6, W, 3.2);
    });
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(1 / w, 1 / h); t.offset.set(-x0 / w, -y0 / h);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  function sideTexture() {
    const W = 256, H = 1024;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = '#CC9D6B'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 90; i++) {
      const x = rnd() * W, ph = rnd() * 6, f = 90 + rnd() * 120;
      g.strokeStyle = 'rgba(128,82,42,' + (0.12 + rnd() * 0.3).toFixed(2) + ')';
      g.lineWidth = 0.6 + rnd() * 2.2;
      g.beginPath(); g.moveTo(x, 0);
      for (let y = 0; y <= H; y += 12) g.lineTo(x + Math.sin(y / f + ph) * 5, y);
      g.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / 32, 1 / 300);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  const sideTex = sideTexture();
  const sideMats = [];
  const PAINT = '#D7DAD5';
  let painted = false;
  function woodMats(capOpts) {
    const side = new THREE.MeshStandardMaterial({ map: sideTex, roughness: 0.6 });
    side.userData.tint = capOpts.tint || '#ffffff';
    sideMats.push(side); applyFinishTo(side);
    return [new THREE.MeshStandardMaterial({ map: capTexture(capOpts), roughness: 0.72 }), side];
  }
  function applyFinishTo(m) {
    if (painted) { m.map = null; m.color.set(PAINT); m.roughness = 0.5; }
    else { m.map = sideTex; m.color.set(m.userData.tint || '#ffffff'); m.roughness = 0.6; }
    m.needsUpdate = true;
  }
  const mat = {
    glass: () => new THREE.MeshStandardMaterial({ color: 0xBFE0EA, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.3, depthWrite: false, side: THREE.DoubleSide }),
    rubber: () => new THREE.MeshStandardMaterial({ color: 0x1C2228, roughness: 0.92 }),
    spacer: () => new THREE.MeshStandardMaterial({ color: 0x23292F, roughness: 0.5, metalness: 0.3 }),
    butyl: () => new THREE.MeshStandardMaterial({ color: 0x5B6168, roughness: 0.9 }),
    silicone: () => new THREE.MeshStandardMaterial({ color: 0xE9EEF1, roughness: 0.4, transparent: true, opacity: 0.92 }),
    metal: () => new THREE.MeshStandardMaterial({ color: 0xA7AFB5, roughness: 0.32, metalness: 0.55 }),
    iron: () => new THREE.MeshStandardMaterial({ color: 0x232527, roughness: 0.42, metalness: 0.55 }),
    block: () => new THREE.MeshStandardMaterial({ color: 0x4E555B, roughness: 0.8 }),
    stone: () => new THREE.MeshStandardMaterial({ color: 0xCBC6BC, roughness: 1 })
  };
  const edgeMat = new THREE.LineBasicMaterial({ color: new THREE.Color(css('--ink') || '#111315'), transparent: true, opacity: 0.4 });

  /* ================= Géométrie ================= */
  function shape(pts) {
    const s = new THREE.Shape(); s.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i];
      if (p.q) s.quadraticCurveTo(p.q[0], p.q[1], p.x, p.y);
      else if (p.c) s.bezierCurveTo(p.c[0], p.c[1], p.c[2], p.c[3], p.x, p.y);
      else if (p.arc) s.absarc(p.arc[0], p.arc[1], p.arc[2], p.arc[3], p.arc[4], !!p.arc[5]);
      else s.lineTo(p[0], p[1]);
    }
    s.closePath(); return s;
  }
  const extrude = (sh, z0, len) => {
    const g = new THREE.ExtrudeGeometry(sh, { depth: len, bevelEnabled: false, curveSegments: 32 });
    g.translate(0, 0, z0); return g;
  };
  const rect = (x0, x1, y0, y1) => shape([[x0, y0], [x1, y0], [x1, y1], [x0, y1]]);
  const rrect = (x0, x1, y0, y1, r) => shape([
    [x0 + r, y0], [x1 - r, y0], { q: [x1, y0], x: x1, y: y0 + r }, [x1, y1 - r], { q: [x1, y1], x: x1 - r, y: y1 },
    [x0 + r, y1], { q: [x0, y1], x: x0, y: y1 - r }, [x0, y0 + r], { q: [x0, y0], x: x0 + r, y: y0 }
  ]);

  /* ================= Modèles ================= */
  const FOOT = 'Schéma de principe : proportions indicatives, non contractuel.';
  const MODELS = {
    coupe: {
      eyebrow: 'MAQUETTE 3D · COUPE VERTICALE',
      title: 'Coupe de la fenêtre bois haut de gamme',
      lede: "Ouvrant 62 mm à la française. Tournez la maquette, écartez les pièces avec la vue éclatée, puis touchez une pièce ou un repère pour sa fiche.",
      hint: '<b>Traverse basse</b> · longueur représentée 300 mm',
      foot: FOOT,
      painted: false, ground: -190, offset: [-50, -100, -150], select: 'ouvrant', target: [0, 0, 0],
      views: { trois: [300, 170, 380], coupe: [0, 10, 560], ext: [-470, 90, 230], int: [470, 90, 230] },
      parts: [
        { id: 'vitrage', nums: [1], name: 'Vitrage isolant',
          text: "Double vitrage 4/20/4 faiblement émissif à lame d'argon, Ug 1,1 W/m²·K en standard. La feuillure accepte jusqu'à 28 mm (ouvrant 62 mm) ou 37 mm (ouvrant 71 mm) pour un vitrage acoustique, retardateur d'effraction ou à contrôle solaire." },
        { id: 'intercalaire', nums: [8], name: 'Intercalaire noir anti-reflet',
          text: "Espaceur entre les deux verres, noir pour rester discret en fond de feuillure. Version warm edge en option pour limiter le pont thermique en rive de vitrage." },
        { id: 'silicone', nums: [6], name: 'Obturateurs silicone',
          text: "Un cordon de chaque côté du vitrage assure l'étanchéité entre le verre et le bois. Vitrages certifiés CEKAL." },
        { id: 'parclose', nums: [2], name: 'Parclose à doucine',
          text: "Moulure qui maintient le vitrage côté extérieur. En variante, cadre parclose en solin mastic pour retrouver l'aspect des menuiseries anciennes." },
        { id: 'ouvrant', nums: [9], name: 'Ouvrant 62 mm',
          text: "Lamellé-collé 3 plis : les lignes de colle se lisent sur la tranche. Angles assemblés à double enfourchement collé, plus robuste qu'un assemblage mécanique.",
          details: [[3, 'Finition usine 300 µm', 'peinture microporeuse en phase aqueuse, garantie fabricant jusqu’à 12 ans en teintes opaques.'],
                    [4, "Jet d'eau", "profil en saillie qui rejette le ruissellement loin de la jonction ouvrant/dormant (E*7B)."],
                    [7, 'Profil mouluré', 'arêtes travaillées côté intérieur.']] },
        { id: 'ferrure', nums: [10], name: 'Ferrure à galets champignons',
          text: "Crémone encastrée dans l'ouvrant : ses galets, réglables en 2 dimensions, se verrouillent dans des gâches de sécurité vissées sur le dormant. Oscillo-battant en option." },
        { id: 'joints', nums: [11], name: 'Double joint sur ouvrant',

    const hit = hits.find(h => h.object.userData.part !== 'vitrage') || hits[0];
    if (hit) select(hit.object.userData.part);
  });

  /* ================= Taille ================= */
  function resize() {
    const w = viewportEl.clientWidth, h = viewportEl.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.zoom = Math.min(1, camera.aspect / 1.15); /* écran en hauteur (téléphone) : on recule pour voir toute la maquette */
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(viewportEl); resize();

  /* ================= Boucle ================= */
  const tmp = new THREE.Vector3();
  const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  function frame(now) {
    if (camAnim) {
      const k = Math.min(1, (now - camAnim.start) / camAnim.dur), e = ease(k);
      camera.position.lerpVectors(camAnim.from, camAnim.to, e);
      controls.target.lerpVectors(camAnim.fromT, camAnim.toT, e);
      if (k >= 1) camAnim = null;
    }
    if (Math.abs(explodeTarget - explodeT) > 0.0005) {
      explodeT += (explodeTarget - explodeT) * 0.1;
      if (Math.abs(explodeTarget - explodeT) < 0.002) explodeT = explodeTarget;
      if (document.activeElement !== slider) { slider.value = Math.round(explodeT * 100); out.textContent = Math.round(explodeT * 100) + ' %'; }
    }
    S.meshes.forEach(r => r.mesh.position.copy(r.explode).multiplyScalar(explodeT));
    controls.update();
    renderer.render(scene, camera);
    if (showLabels) {
      const w = viewportEl.clientWidth, h = viewportEl.clientHeight;
      S.labels.forEach(l => {
        if (S.hidden.has(l.pid)) { l.el.hidden = true; return; }
        tmp.copy(l.local).add(l.rec.mesh.position);
        S.root.localToWorld(tmp); tmp.project(camera);
        const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.05 && Math.abs(tmp.y) < 1.05;
        l.el.hidden = !vis;
        if (vis) l.el.style.transform = 'translate(' + ((tmp.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - tmp.y) / 2 * h).toFixed(1) + 'px)';
      });
    }
    requestAnimationFrame(frame);
  }
  /* hauteur transmise à la page qui affiche la maquette (téléphone : maquette et fiche empilées) */
  const sendHeight = () => { try { parent.postMessage({ mdpCoupe: Math.ceil(document.querySelector('.app').getBoundingClientRect().height) }, '*'); } catch (e) {} };
  new ResizeObserver(sendHeight).observe(document.querySelector('.app'));
  switchModel(MODELS[location.hash.slice(1)] ? location.hash.slice(1) : 'coupe');
  requestAnimationFrame(frame);
})();
</script>
</body>
