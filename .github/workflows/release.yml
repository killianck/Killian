name: Publier une version

# Se déclenche quand on pousse un tag de version (ex. v0.2.2).
# Construit l'installeur Windows et le publie dans les "Releases" du dépôt.
# L'application installée le télécharge alors et se met à jour toute seule.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm test

      # Construit l'installeur + latest.yml + blockmap dans dist-app/ (sans publier).
      - run: npm run app:build
      - run: npx electron-builder --win nsis --publish never

      # Publication robuste des fichiers (gère bien les gros fichiers, échoue si un manque).
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist-app/*.exe
            dist-app/latest.yml
            dist-app/*.blockmap
          fail_on_unmatched_files: true
